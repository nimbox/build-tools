name: Create Java Release Workflow

on:
  workflow_call:
    inputs:
      workingDirectory:
        required: false
        type: string
        default: '.'
      javaVersion:
        required: false
        type: string
        default: '21'
      dockerSupport:
        required: false
        type: boolean
        default: false
      generateRelease:
        required: false
        type: boolean
        default: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.workingDirectory }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify version against tag
        working-directory: ${{ github.workspace }}
        run: |
          if [ -f VERSION ]; then
            curl -fsSL https://raw.githubusercontent.com/nimbox/build-tools/main/scripts/bump.sh -o /tmp/bump.sh
            bash /tmp/bump.sh verify "${GITHUB_REF_NAME}"
          else
            echo "no VERSION file; skipping version verification"
          fi
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.javaVersion }}
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Setup Docker (Optional)
        if: ${{ inputs.dockerSupport }}
        uses: docker/setup-buildx-action@v3
      - name: Build Gradle
        run: ./gradlew build
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.NIMBOX_PUBLISH_TOKEN }}
      - name: Publish to GitHub Packages
        run: ./gradlew publish
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.NIMBOX_PUBLISH_TOKEN }}
  create-release:
    needs: build-and-publish
    if: ${{ inputs.generateRelease }}
    uses: nimbox/build-tools/.github/workflows/create-release.yaml@main
    secrets: inherit
